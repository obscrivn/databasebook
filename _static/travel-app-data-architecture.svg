<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Modern travel application data architecture</title>
  <desc id="desc">A conceptual diagram showing users, bookings, and payments stored in PostgreSQL, hotel photos in object storage, search cache in a key-value store, semantic search in a vector index, and an AI travel agent reading and writing through these systems.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .app { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 18; ry: 18; }
      .db { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; ry: 18; }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 18; ry: 18; }
      .cache { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; ry: 18; }
      .vector { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; rx: 18; ry: 18; }
      .agent { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; ry: 18; }
      .label { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 20px Arial, sans-serif; fill: #334155; }
      .small { font: 500 18px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" />

  <text class="label" x="60" y="60">Modern application architecture: databases still matter</text>
  <text class="sub" x="60" y="95">Example: a travel application uses several data systems, not just one database.</text>

  <rect class="app" x="50" y="160" width="320" height="150" />
  <text class="label" x="105" y="225">Travel app / API</text>
  <text class="small" x="105" y="265">web, mobile, backend</text>

  <rect class="agent" x="50" y="390" width="320" height="150" />
  <text class="label" x="92" y="455">AI travel agent</text>
  <text class="small" x="92" y="495">helps users plan and book trips</text>

  <rect class="db" x="470" y="120" width="290" height="220" />
  <text class="label" x="535" y="175">PostgreSQL</text>
  <text class="sub" x="520" y="215">transactional records</text>
  <text class="small" x="520" y="255">• users</text>
  <text class="small" x="520" y="285">• bookings</text>
  <text class="small" x="520" y="315">• payments</text>

  <rect class="store" x="840" y="120" width="280" height="120" />
  <text class="label" x="892" y="175">Object storage</text>
  <text class="small" x="910" y="215">hotel photos and files</text>

  <rect class="cache" x="840" y="290" width="280" height="120" />
  <text class="label" x="888" y="345">Key-value store</text>
  <text class="small" x="915" y="385">search cache</text>

  <rect class="vector" x="840" y="460" width="280" height="140" />
  <text class="label" x="902" y="515">Vector index</text>
  <text class="small" x="900" y="555">semantic search</text>
  <text class="small" x="872" y="585">similarity-based retrieval</text>

  <path class="arrow" d="M370 235 C405 235, 425 230, 470 230" />
  <path class="arrow" d="M370 465 C410 465, 420 280, 470 260" />
  <path class="arrow" d="M760 180 C800 180, 805 180, 840 180" />
  <path class="arrow" d="M760 240 C820 240, 805 330, 840 350" />
  <path class="arrow" d="M760 300 C820 330, 805 515, 840 530" />

  <path class="arrow-soft" d="M370 470 C520 620, 760 620, 840 560" />
  <text class="small" x="390" y="650">agents need to read and write across database systems</text>

  <text class="sub" x="480" y="435">Databases still hold:</text>
  <text class="small" x="480" y="475">• users and permissions</text>
  <text class="small" x="480" y="505">• transactions and application state</text>
  <text class="small" x="480" y="535">• conversation history and tool results</text>
</svg>
