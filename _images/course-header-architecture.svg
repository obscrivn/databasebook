<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Modern application and database architecture</title>
  <desc id="desc">A simple diagram showing an application interacting with a relational database, cloud data services, and AI components.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="app" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="data" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" x2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" x2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>

  <text x="700" y="48" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">Modern application architecture</text>

  <g filter="url(#shadow)">
    <rect x="80" y="120" width="220" height="150" rx="18" fill="url(#app)" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="165" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">Web app</text>
    <text x="190" y="196" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">mobile</text>
    <text x="190" y="222" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">API</text>
    <text x="190" y="248" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="90" width="260" height="190" rx="18" fill="url(#data)" stroke="#22c55e" stroke-width="2"/>
    <text x="550" y="140" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">Relational</text>
    <text x="550" y="170" font-size="24" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">database</text>
    <text x="550" y="205" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">tables</text>
    <text x="550" y="230" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">keys &amp; relationships</text>
    <text x="550" y="255" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">constraints</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="120" width="240" height="150" rx="18" fill="url(#cloud)" stroke="#f59e0b" stroke-width="2"/>
    <text x="880" y="160" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">Cloud / data</text>
    <text x="880" y="190" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">object storage</text>
    <text x="880" y="218" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">cache</text>
    <text x="880" y="246" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">search</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="120" width="220" height="150" rx="18" fill="url(#ai)" stroke="#ec4899" stroke-width="2"/>
    <text x="1170" y="165" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle" font-weight="700">AI agent</text>
    <text x="1170" y="196" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">reads task</text>
    <text x="1170" y="222" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">writes results</text>
    <text x="1170" y="248" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" text-anchor="middle">uses data</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 195 H420"/>
    <path d="M680 195 H760"/>
    <path d="M1000 195 H1060"/>
    <path d="M1170 270 V328"/>
    <path d="M550 280 V328"/>
    <path d="M550 328 H1170"/>
  </g>

  <g>
    <rect x="470" y="328" width="330" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="635" y="362" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#334155" text-anchor="middle">database systems still hold the truth</text>
  </g>

  <g>
    <text x="700" y="400" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#475569" text-anchor="middle">Applications read and write through database systems, even in modern AI and cloud architectures.</text>
  </g>
</svg>
